# Server configuration
server.port=8080

# Application Details
spring.application.name=campus-harmony-backend

# MySQL Database Connectivity (JDBC / JPA)
spring.datasource.url=jdbc:mysql://localhost:3306/campus_harmony?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Logging Configuration
logging.level.com.campusharmony=INFO
logging.level.org.springframework.web=INFO
