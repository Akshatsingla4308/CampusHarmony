# Server configuration
server.port=8080

# Application Details
spring.application.name=campus-harmony-backend

# MySQL Database Connectivity (JDBC / JPA)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campus_harmony?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${CAMPUS_DB_USER:root}
spring.datasource.password=${CAMPUS_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Campus Harmony Admin Bootstrap
campus.admin.login=${CAMPUS_ADMIN_LOGIN:admin}
campus.admin.password=${CAMPUS_ADMIN_PASSWORD:}

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Logging Configuration
logging.level.com.campusharmony=INFO
logging.level.org.springframework.web=INFO

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
