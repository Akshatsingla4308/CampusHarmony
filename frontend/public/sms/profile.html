<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Profile · Sunrise Institute Student ERP</title>
<meta name="description" content="Full student profile with personal details, courses, attendance and performance.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/students.css">
</head>
<body>
<div class="loader" data-loader>
  <div class="loader__inner">
    <div class="loader__mark">SM</div>
    <strong>Sunrise Institute ERP</strong>
    <div class="loader__bar"></div>
  </div>
</div>
<div class="app">
  <aside class="sidebar" data-sidebar aria-label="Sidebar"></aside>
  <div class="scrim" data-scrim></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn hamburger" type="button" data-sidebar-toggle aria-label="Toggle navigation">☰</button>
      <div class="topbar__titles">
        <nav class="crumbs" data-breadcrumb aria-label="Breadcrumb"></nav>
        <h1>Student Profile</h1>
      </div>
      <div class="topbar__actions">
        <button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Toggle dark mode">
          <span class="theme-toggle__sun">☾</span><span class="theme-toggle__moon">☀</span>
        </button>
        <div class="user-chip">
          <span class="avatar" aria-hidden="true">·</span>
          <span class="user-chip__meta"><strong>Loading…</strong><span> </span></span>
        </div>
      </div>
    </header>

    <section class="card slide-up" style="margin-bottom:16px">
      <div class="panel__head">
        <div data-hero style="flex:1"></div>
        <div>
          <label class="sr-only" for="student-picker">Choose student</label>
          <select class="input" id="student-picker" data-student-picker></select>
        </div>
      </div>
      <div data-badges></div>
    </section>
    <section class="grid profile-grid">
      <div class="grid">
        <div class="card">
          <div class="panel__head"><div><h2>Personal details</h2><p>On record with the academic office</p></div></div>
          <div data-details></div>
        </div>
        <div class="card">
          <div class="panel__head"><div><h2>Performance</h2><p>Subject-wise scores and result</p></div></div>
          <div data-performance></div>
        </div>
      </div>
      <div class="grid">
        <div class="card">
          <div class="panel__head"><div><h2>Attendance</h2><p>Current term summary</p></div></div>
          <div data-attendance></div>
        </div>
        <div class="card">
          <div class="panel__head"><div><h2>Enrolled courses</h2><p>Mapped to the student semester</p></div></div>
          <div data-courses></div>
        </div>
        <div class="card">
          <div class="panel__head"><div><h2>Recent activity</h2></div></div>
          <div data-activity></div>
        </div>
      </div>
    </section>

  </main>
</div>
<script src="data/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
