# =============================================================================
# Campus Harmony — Docker Compose Multi-Container Orchestration
# =============================================================================
# Services:
#   1. mysql    - MySQL 8.0 Database with automatic init and persistent volume
#   2. backend  - Java 17/21 Spring Boot REST API
#   3. frontend - React + TanStack SSR / Client Development & Preview Server
# =============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: campusharmony-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campus_harmony
      MYSQL_ROOT_PASSWORD: ${CAMPUS_DB_PASSWORD:-RootPass2026!}
    ports:
      - "3306:3306"
    volumes:
      - campusharmony_mysql_data:/var/lib/mysql
      - ./database/init_complete.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${CAMPUS_DB_PASSWORD:-RootPass2026!}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    container_name: campusharmony-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/campus_harmony?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      CAMPUS_DB_USER: root
      CAMPUS_DB_PASSWORD: ${CAMPUS_DB_PASSWORD:-RootPass2026!}
      CAMPUS_ADMIN_LOGIN: ${CAMPUS_ADMIN_LOGIN:-admin}
      CAMPUS_ADMIN_PASSWORD: ${CAMPUS_ADMIN_PASSWORD:-AdminPass2026!}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/auth/me || test $$? -eq 22"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    container_name: campusharmony-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:5173"

volumes:
  campusharmony_mysql_data:
    name: campusharmony_mysql_data
